<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roomie Rent - Reset Password</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FAFAFA;
    }
    .font-mono-label {
      font-family: 'JetBrains Mono', monospace;
    }
    .bg-terracotta { background-color: #C85A32; }
    .bg-terracotta-hover:hover { background-color: #B24E2A; }
    .focus-ring-terracotta:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(200, 90, 50, 0.2);
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen selection:bg-orange-100 selection:text-orange-900 flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white p-8 sm:p-10 rounded-3xl shadow-xl border border-slate-100 relative">
    
    <!-- BRAND HEADER -->
    <div class="flex items-center space-x-2.5 mb-6">
      <div class="w-9 h-9 rounded-2xl bg-terracotta flex items-center justify-center text-white shadow-md shadow-orange-900/20">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
          <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l1.293 1.293a1 1 0 001.414-1.414l-7-7z"/>
        </svg>
      </div>
      <span class="font-bold text-lg tracking-tight text-slate-900">Roomie<span class="text-[#C85A32]">Rent</span></span>
    </div>

    <!-- TITLE & SUBTITLE -->
    <h2 class="text-2xl font-bold tracking-tight text-slate-900 mb-1">Create New Password</h2>
    <p class="text-xs text-slate-500 mb-6">Enter your new secure password below to regain access.</p>

    <!-- ALERT BANNER -->
    <div id="reset-alert" class="hidden mb-4 p-3 rounded-xl text-xs font-medium"></div>

    <!-- FORM -->
    <form onsubmit="handleResetPassword(event)" class="space-y-4">
      
      <!-- NEW PASSWORD -->
      <div>
        <label class="block text-[10px] font-bold text-slate-400 tracking-wider font-mono-label mb-1.5 uppercase">NEW PASSWORD</label>
        <div class="relative">
          <input id="new-password" type="password" required minlength="8" placeholder="Min. 8 characters" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus-ring-terracotta transition pr-12">
          <button type="button" onclick="togglePassword('new-password')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-slate-400 hover:text-slate-600 font-medium">Show</button>
        </div>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div>
        <label class="block text-[10px] font-bold text-slate-400 tracking-wider font-mono-label mb-1.5 uppercase">CONFIRM NEW PASSWORD</label>
        <div class="relative">
          <input id="confirm-password" type="password" required minlength="8" placeholder="Re-enter new password" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus-ring-terracotta transition pr-12">
          <button type="button" onclick="togglePassword('confirm-password')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-slate-400 hover:text-slate-600 font-medium">Show</button>
        </div>
      </div>

      <!-- SUBMIT BUTTON -->
      <button type="submit" id="btn-submit" class="w-full bg-terracotta bg-terracotta-hover text-white font-semibold py-3.5 rounded-2xl shadow-lg shadow-orange-900/15 transition-all mt-2">
        Update Password
      </button>

    </form>

    <p class="text-center text-xs text-slate-400 mt-6">
      Remembered your password? <a href="login.html" class="text-[#C85A32] font-semibold hover:underline">Sign in</a>
    </p>

  </div>

  <script>
    const API_BASE_URL = 'https://roomie-rent.onrender.com/api';

    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function showAlert(message, isError = true) {
      const alertBox = document.getElementById('reset-alert');
      alertBox.textContent = message;
      alertBox.className = `mb-4 p-3 rounded-xl text-xs font-medium ${isError ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-600 border border-emerald-200'}`;
      alertBox.classList.remove('hidden');
    }

    async function handleResetPassword(event) {
      event.preventDefault();

      const urlParams = new URLSearchParams(window.location.search);
      const email = urlParams.get('email');
      const token = urlParams.get('token');

      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      // Validation Checks
      if (newPassword !== confirmPassword) {
        showAlert('Passwords do not match. Please check and try again.');
        return;
      }

      if (newPassword.length < 8) {
        showAlert('Password must be at least 8 characters long.');
        return;
      }

      const submitBtn = document.getElementById('btn-submit');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Updating Password...';

      try {
        const response = await fetch(`${API_BASE_URL}/auth/update-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, token, password: newPassword })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Failed to update password.');

        showAlert('Password updated successfully! Redirecting to sign in...', false);

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      } catch (err) {
        showAlert(err.message || 'An error occurred. Please try again.');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Update Password';
      }
    }
  </script>
</body>
</html>
